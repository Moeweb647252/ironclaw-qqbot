name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test And Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Run tests
        run: cargo test

      - name: Build release bundle
        run: ./build.sh

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qqbot-wasm32-wasip2
          path: |
            qqbot.wasm
            qqbot.capabilities.json
            qqbot-wasm32-wasip2.tar.gz
            qqbot-wasm32-wasip2.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish Release Assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          name: qqbot-wasm32-wasip2
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/qqbot.wasm
            dist/qqbot.capabilities.json
            dist/qqbot-wasm32-wasip2.tar.gz
            dist/qqbot-wasm32-wasip2.tar.gz.sha256
          generate_release_notes: true
